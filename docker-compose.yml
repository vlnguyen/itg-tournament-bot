services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: itg
      POSTGRES_PASSWORD: itg
      POSTGRES_DB: itg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itg -d itg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
