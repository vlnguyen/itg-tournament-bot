services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: itg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itg}
      POSTGRES_DB: itg
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itg -d itg"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NestJS: Discord gateway + API + websockets + the static Vite build,
  # all in one process — see DESIGN.md, "Deployment".
  app:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL a local .env has (dev points at
      # localhost:5433, which isn't reachable from inside this container).
      # `postgres:5432` is the in-network service name/port, unaffected
      # by the host-side 5433 mapping above.
      DATABASE_URL: postgresql://itg:${POSTGRES_PASSWORD:-itg}@postgres:5432/itg?schema=public
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

  # Reverse proxy + automatic Let's Encrypt HTTPS for production, where a
  # real domain (PUBLIC_DOMAIN) points at this host. Behind a profile so
  # local `docker compose up` (no --profile flag) never starts it — dev
  # just hits the app directly on port 3000, same as always.
  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
