<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITG Tournament</title>
    <script>
      // Sets the color scheme before first paint, so there's no flash of
      // the wrong theme while React loads. Reads the same localStorage key
      // Mantine's own color-scheme manager uses, defaulting to dark per
      // MantineProvider's defaultColorScheme in main.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('mantine-color-scheme-value');
          var scheme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch (e) {
          document.documentElement.setAttribute('data-mantine-color-scheme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
